server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 320m;          # dataset CSV uploads (admin)
  gzip on; gzip_types text/css application/javascript application/json;

  location /api/   { proxy_pass http://backend:8000; proxy_read_timeout 600s;
                     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /media/ { proxy_pass http://backend:8000; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /       { try_files $uri /index.html; }       # single-page app routes
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
}
