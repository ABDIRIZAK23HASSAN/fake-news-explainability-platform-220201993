# Quick start:  cp .env.example .env  (edit secrets)  &&  docker compose up -d --build
# Then load data + train:  see README "First run".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fakenews}
      POSTGRES_USER: ${POSTGRES_USER:-fakenews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fakenews} -d ${POSTGRES_DB:-fakenews}"]
      interval: 5s
      retries: 12

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fakenews}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fakenews}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EXPOSE_RESET_TOKEN: ${EXPOSE_RESET_TOKEN:-false}
    volumes:
      - appdata:/srv/backend/storage         # trained models, similarity index, avatars
      - ${DATASET_DIR:-./dataset}:/data:ro   # folder with Fake.csv and True.csv (for bootstrap)
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["${WEB_PORT:-8080}:80"]

volumes: { pgdata: {}, appdata: {} }
